name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping API
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://cornerstonefamilychapel-onrender-com.onrender.com/api/settings > /dev/null
